[package]
name = "gauger"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
description = "A terminal resource monitor for Docker and Podman"
license = "MIT"
repository = "https://github.com/Adega318/gauger-rs"
readme = "README.md"
keywords = ["tui", "docker", "podman", "monitoring", "containers"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "/src/**/*",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/LICENSE.md",
]

[dependencies]
tokio = { version = "1.54.1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
bollard = "0.21.1"
thiserror = "2.0.21"
futures-util = "0.3.34"
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
