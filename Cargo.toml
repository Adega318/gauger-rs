[package]
name = "gauger"
version = "0.1.0"
edition = "2024"
description = "A terminal resource monitor for Docker and Podman"
license = "MIT"
keywords = ["tui", "docker", "podman", "monitoring"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
bollard = "0.21"
thiserror = "2"
futures-util = "0.3"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
